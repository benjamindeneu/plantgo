<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title data-i18n="signup.pageTitle">PlantGo • Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css?v=20260909-1" />
  <link rel="stylesheet" href="./assets/styles.v2.css?v=20260918-4" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PlantGo" />
</head>
<body class="v2 auth-page">
  <div class="card" style="width:min(92vw,420px)">
    <div class="lang-wrapper">
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="en">🇬🇧 EN</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="it">🇮🇹 IT</option>
        <option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option>
      </select>
    </div>
    <h1 data-i18n="signup.title">Create your account</h1>

    <form id="signupForm" class="form-grid">
      <input
        id="username"
        name="username"
        class="input"
        type="text"
        autocomplete="nickname"
        data-i18n-placeholder="signup.username"
        placeholder="Username"
        required
      />

      <input
        id="email"
        name="email"
        class="input"
        type="email"
        autocomplete="email"
        inputmode="email"
        data-i18n-placeholder="signup.email"
        placeholder="Email"
        required
      />

      <input
        id="password"
        name="new-password"
        class="input"
        type="password"
        autocomplete="new-password"
        data-i18n-placeholder="signup.password"
        placeholder="Password"
        required
      />

      <input
        id="confirmPassword"
        name="confirm-password"
        class="input"
        type="password"
        autocomplete="new-password"
        data-i18n-placeholder="signup.confirm"
        placeholder="Confirm Password"
        required
      />

      <button class="primary" type="submit" data-i18n="signup.button">
        Sign Up
      </button>
    </form>

    <p class="muted">
      <span data-i18n="signup.haveAccount">Already have an account?</span>
      <a href="./login.html" data-i18n="signup.login">Log in</a>
    </p>

    <div id="signupMessage" class="validation-feedback" aria-live="polite"></div>
  </div>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./signup.js"></script>
</body>
</html>
